services:
  - type: web
    name: flouba-lite-backend
    runtime: docker
    plan: starter
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: flouba-lite-postgres
          property: connectionString
      - key: BASE44_API_KEY
        generateValue: true
      - key: MT5_ROBOT_API_KEY
        generateValue: true
      - key: INTERNAL_ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: BASE44_HMAC_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
databases:
  - name: flouba-lite-postgres
    plan: basic-256mb
