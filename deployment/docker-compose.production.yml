services:
  app:
    image: ${IMAGE:-flouba-lite-backend:latest}
    env_file: ../.env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "true"
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8080/health/live', (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
